name: Generate & Publish Stick Figure Videos

on:
  workflow_dispatch:
    inputs:
      database:
        description: "Script database file"
        type: choice
        options:
          - "10000_Master_Stick_Figure_Scripts_Database.xlsx"
        default: "10000_Master_Stick_Figure_Scripts_Database.xlsx"
      start_id:
        description: "First Video ID to generate (e.g. VID-00001)"
        type: string
        default: "VID-00001"
      count:
        description: "How many videos to generate in this run"
        type: number
        default: 3

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate videos
        run: |
          python generate_video.py \
            --db "${{ inputs.database }}" \
            --start-id "${{ inputs.start_id }}" \
            --count "${{ inputs.count }}" \
            --out-dir output

      - uses: actions/upload-artifact@v4
        with:
          name: stick-figure-videos
          path: output/*.mp4

  # Runs only once YOUTUBE_CLIENT_ID / YOUTUBE_CLIENT_SECRET / YOUTUBE_REFRESH_TOKEN
  # secrets exist in this repo's settings. See scripts/publish_youtube.py for how to obtain them.
  publish-youtube:
    needs: generate
    runs-on: ubuntu-latest
    if: ${{ secrets.YOUTUBE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-publish.txt
      - uses: actions/download-artifact@v4
        with:
          name: stick-figure-videos
          path: output
      - name: Upload each video to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          for f in output/*.mp4; do
            id=$(basename "$f" .mp4)
            python scripts/publish_youtube.py --file "$f" --title "$id" --description "Generated by the stick figure pipeline"
          done

  # Runs only once FACEBOOK_PAGE_ID / FACEBOOK_PAGE_ACCESS_TOKEN secrets exist.
  # See scripts/publish_facebook.py for how to obtain them.
  publish-facebook:
    needs: generate
    runs-on: ubuntu-latest
    if: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-publish.txt
      - uses: actions/download-artifact@v4
        with:
          name: stick-figure-videos
          path: output
      - name: Upload each video to Facebook
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          for f in output/*.mp4; do
            python scripts/publish_facebook.py --file "$f" --description "Generated by the stick figure pipeline"
          done

  # Runs only once TIKTOK_ACCESS_TOKEN secret exists. See scripts/publish_tiktok.py
  # for how to obtain it, and note TikTok requires app review before public direct-post works.
  publish-tiktok:
    needs: generate
    runs-on: ubuntu-latest
    if: ${{ secrets.TIKTOK_ACCESS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-publish.txt
      - uses: actions/download-artifact@v4
        with:
          name: stick-figure-videos
          path: output
      - name: Upload each video to TikTok
        env:
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: |
          for f in output/*.mp4; do
            id=$(basename "$f" .mp4)
            python scripts/publish_tiktok.py --file "$f" --title "$id"
          done
